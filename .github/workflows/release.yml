name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build, test, and package on every platform as the release gate. Nothing is
  # published unless this passes on both.
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Setup cmake
      uses: lukka/get-cmake@v4.4.2
      with:
        cmakeVersion: '4.4.0'

    - name: Setup Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: >
        cmake -B build -S .
        -DCMAKE_BUILD_TYPE=Release
        -DPython3_ROOT_DIR="${{ env.pythonLocation }}"
        -DASYNCIODAT_BUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config Release --parallel 2

    # The macOS plugin loads inside TouchDesigner on users' machines, so nothing
    # about this runner may leak into it: no link against a Python that only
    # exists here, a minimum OS TouchDesigner supports, both architectures, and
    # a bundle signature codesign accepts. v0.4.0 shipped arm64-only with a
    # minimum of macOS 26 (the runner's) and a linker-only signature.
    - name: Verify macOS plugin
      if: runner.os == 'macOS'
      run: |
        status=0
        plugin=build/bin/AsyncioDAT.plugin
        bin="$plugin/Contents/MacOS/AsyncioDAT"
        echo "== $plugin"
        otool -L "$bin"
        if otool -L "$bin" | grep -qi python; then
          echo "::error::$plugin links a Python library; it must resolve Python from the host process." >&2; status=1
        fi
        archs=$(lipo -archs "$bin")
        echo "archs: $archs"
        case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *)
          echo "::error::$plugin is not a universal binary (got: $archs)." >&2; status=1 ;;
        esac
        minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
        echo "minos: $minos"
        if [ "$minos" != "13.3" ]; then
          echo "::error::$plugin minimum macOS is $minos, expected 13.3." >&2; status=1
        fi
        if ! codesign --verify --deep --strict -vv "$plugin"; then
          echo "::error::$plugin has no valid bundle signature." >&2; status=1
        fi
        exit $status

    - name: Install test dependencies
      run: python -m pip install --upgrade pip -r tests/python/requirements.txt

    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path build/bin/Release/AsyncioDAT.dll -DestinationPath AsyncioDAT-windows.zip

    # ditto, not zip: the .plugin is a bundle, and ditto preserves the symlinks
    # and resource forks a plain zip would flatten.
    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: ditto -c -k --keepParent build/bin/AsyncioDAT.plugin AsyncioDAT-macos.zip

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: package-${{ runner.os }}
        path: AsyncioDAT-*.zip
        if-no-files-found: error

  # Publish the release from the artifacts the gate produced.
  #
  # Only runs for tag pushes. A release cannot be published from a branch, so on
  # workflow_dispatch this job is skipped and the workflow acts as a dry run of
  # the cross-platform build, test, and packaging gate above.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Squash-merging a pull request rewrites the commit, so a tag pushed to the
    # pre-merge branch tip builds and tests green while pointing at a commit
    # reachable only from the tag. Publishing that produces a release whose
    # history is not on main, which is only noticed much later by whoever pins
    # it. Refuse the tag instead.
    - name: Verify the tag is on main
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
          echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main. Delete the tag, then re-tag the merged commit on main." >&2
          exit 1
        fi
        echo "$GITHUB_REF_NAME is on main."

    - name: Download Windows package
      uses: actions/download-artifact@v8
      with:
        name: package-Windows
        path: dist

    - name: Download macOS package
      uses: actions/download-artifact@v8
      with:
        name: package-macOS
        path: dist

    # Use the CHANGELOG entry for this tag as the release body, so the notes are
    # written once and reviewed in the pull request that introduced them.
    - name: Extract release notes from CHANGELOG
      run: |
        version="${GITHUB_REF_NAME#v}"
        # Match the heading by prefix rather than by regex: a version string
        # interpolated into a regex turns "[0.4.0]" into a character class, and
        # whether the escaping survives depends on the awk in use (mawk keeps
        # the backslash, gawk drops it and silently matches nothing).
        awk -v head="## [$version]" '
          index($0, head) == 1      { found = 1; next }  # heading for this version
          found && index($0, "## [") == 1 { exit }       # next version heading
          found && /^\[.*\]: /      { exit }             # link reference block
          found && index($0, "<!--") == 1 { exit }       # trailing comments
          found                     { print }
        ' CHANGELOG.md \
          | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;};/\n$/ba' > RELEASE_NOTES.md

        if [ ! -s RELEASE_NOTES.md ]; then
          echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before tagging $GITHUB_REF_NAME." >&2
          exit 1
        fi
        echo "Release notes for $version:"
        cat RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/AsyncioDAT-*.zip
        name: Release ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
        draft: false
        prerelease: false
