name: Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25'

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

    - name: Build project
      run: cmake --build build --config Release

    # Package the platform artifact into a single uploadable file.
    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path build/bin/Release/AsyncioDAT.dll -DestinationPath AsyncioDAT-windows.zip

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: ditto -c -k --keepParent build/bin/AsyncioDAT.plugin AsyncioDAT-macos.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: AsyncioDAT-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
