syntax = "proto3";

package testservice;

// Calculator service for testing AsyncioDAT gRPC integration
service CalculatorService {
    // Simple unary operations
    rpc Add(AddRequest) returns (AddResponse);
    rpc Multiply(MultiplyRequest) returns (MultiplyResponse);
    rpc Echo(EchoRequest) returns (EchoResponse);
    rpc SetStringPar(SetStringParRequest) returns (SetStringParResponse);

    // Bidirectional streaming calculator
    rpc Calculator(stream CalculatorRequest) returns (stream CalculatorResponse);
}

// Add operation messages
message AddRequest {
    double a = 1;
    double b = 2;
}

message AddResponse {
    double result = 1;
    string message = 2;
}

// Multiply operation messages
message MultiplyRequest {
    double a = 1;
    double b = 2;
}

message MultiplyResponse {
    double result = 1;
    string message = 2;
}

// Echo operation messages
message EchoRequest {
    string text = 1;
}

message EchoResponse {
    string echo = 1;
    int64 timestamp = 2;
}

message SetStringParRequest {
    string value = 1;
}

message SetStringParResponse {
    bool success = 1;
    string message = 2;
}
    
// Calculator streaming messages
message CalculatorRequest {
    enum Operation {
        ADD = 0;
        SUBTRACT = 1;
        MULTIPLY = 2;
        DIVIDE = 3;
    }
    
    Operation operation = 1;
    double a = 2;
    double b = 3;
}

message CalculatorResponse {
    double result = 1;
    string message = 2;
    bool success = 3;
}
