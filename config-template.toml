# this is a template config that if required will be loaded if named config.toml
# is located beside the .toe file loading the AsyncioDAT
[main]
# List of paths to be prepended to sys.path
paths = [
    "some_path/to/some_module",
    "another/path/to/env/Lib/site-packages",
    ".venv/Lib/site-packages"
]

[asyncio]
# Path to a module that contains an `on_start(asyncio_dat)` function (and any
# other lifecycle callbacks). Defaults to "asyncio_dat_callbacks.py" if omitted.
callback_module_path = "asyncio_dat_callbacks.py"